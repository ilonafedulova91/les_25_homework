{% extends 'catalog/base.html' %}

{% block content %}

<h1>{{ object.title }}</h1>

{% if object.preview %}
    <img src="{{ object.preview.url }}" class="img-fluid mb-3">
{% endif %}

<p>{{ object.content }}</p>

<p>
    Просмотров: {{ object.views_count }}
</p>

<a href="{% url 'blog:update' object.pk %}" class="btn btn-warning">
    Изменить
</a>

<a href="{% url 'blog:delete' object.pk %}" class="btn btn-danger">
    Удалить
</a>

{% endblock %}
