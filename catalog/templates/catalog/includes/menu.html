<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-auto font-weight-normal">Skystore</h5>

    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'home' %}">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'contacts' %}">Контакты</a>

        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-success" href="{% url 'product_create' %}">
            Добавить товар
            </a>

            <span class="ms-3 me-2">
                👋 {{ user.email }}
            </span>

            <a class="p-2 btn btn-outline-info"
               href="{% url 'users:profile' %}">
                Профиль
            </a>

            <form action="{% url 'users:logout' %}"
                  method="post"
                  style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                        class="btn btn-outline-danger">
                    Выйти
                </button>
            </form>
        {% else %}
            <a class="p-2 btn btn-outline-secondary" href="{% url 'users:register' %}">
                Регистрация
            </a>

            <a class="p-2 btn btn-outline-secondary" href="{% url 'users:login' %}">
                Вход
            </a>
        {% endif %}
    </nav>
</div>
