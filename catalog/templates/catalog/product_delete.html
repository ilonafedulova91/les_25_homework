{% extends "catalog/base.html" %}

{% block content %}

<div class="col-md-6 mx-auto">

    <div class="card">

        <div class="card-header">
            <h3>Удаление товара</h3>
        </div>

        <div class="card-body">

            <p>
                Вы действительно хотите удалить
                <strong>{{ object.name }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <button type="submit"
                        class="btn btn-danger">
                    Удалить
                </button>

                <a href="{% url 'home' %}"
                   class="btn btn-secondary">
                    Отмена
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
