{% extends "catalog/base.html" %}

{% block content %}

<div class="col-md-8 mx-auto">

    <div class="card">

        {% if product.image %}
            <img src="{{ product.image.url }}"
                 class="card-img-top">
        {% endif %}

        <div class="card-body">

            <h2>{{ product.name }}</h2>

            <p>
                {{ product.description }}
            </p>

            <h4>
                Цена: {{ product.purchase_price }}
            </h4>

            <div class="mt-3">

                <a href="{% url 'product_update' product.pk %}"
                   class="btn btn-warning">
                    Редактировать
                </a>

                <a href="{% url 'product_delete' product.pk %}"
                   class="btn btn-danger">
                    Удалить
                </a>

                <a href="{% url 'home' %}"
                   class="btn btn-secondary">
                    Назад
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
